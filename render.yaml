# ---------------------------------------------------------------------------
# Render — PRIMARY deploy target (free tier, NO credit card needed).
# Free tier: 750 instance-hours/month, 512 MB RAM, 0.1 CPU, 5 GB/month
# outbound bandwidth. The service spins down after 15 min idle (~1 min
# cold start on the next request).
#
# Build installs the Python deps AND Playwright Chromium (needed for the
# automatic userKey refresh). Chromium is only launched on demand for a
# few seconds per refresh and always closed afterwards, so the steady
# state stays small — but if key refresh ever OOMs on 512 MB, set
# PERCHANCE_USER_KEY by hand (copy it from a desktop browser on the
# same machine) and the server never launches a browser.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: perchance-api
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PERCHANCE_USER_KEY
        value: ""
