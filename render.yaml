# ---------------------------------------------------------------------------
# Render — PRIMARY deploy target (free tier, NO credit card needed).
# Free tier: 750 instance-hours/month, 512 MB RAM, 0.1 CPU, 5 GB/month
# outbound bandwidth. The service spins down after 15 min idle (~1 min
# cold start on the next request).
#
# Deploys as a DOCKER service (env: docker) — NOT the native Python env.
# Two reasons, both learned the hard way:
#   1. plan: free must be declared, or Render's Blueprint defaults the
#      service to a paid plan and asks for payment info.
#   2. `patchright install chromium --with-deps` needs root for system
#      packages; the native Python build runs as a non-root user and fails
#      with "su: Authentication failure". Inside Docker the install runs
#      as root and works.
# The Dockerfile installs Patchright Chromium (stealth browser for the
# automatic userKey refresh) and runs uvicorn on $PORT.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: perchance-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PERCHANCE_USER_KEY
        value: ""
